<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQI | Spatial Quality Improvement</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#0B1F4B;--card:#112b63;--tx:#eaf2ff;--mut:#a9c0e0;--pri:#5CC8FF;--onpri:#0B1F4B;--ln:#27498f;--navy:#0B1F4B;--sky:#5CC8FF;--sky2:#2DA8E8}
@media (prefers-color-scheme:dark){:root{--bg:#0a1426;--card:#12213b;--tx:#e8f1fb;--mut:#9db4cc;--pri:#5CC8FF;--onpri:#0B1F4B;--ln:#24395c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,Arial,sans-serif;line-height:1.7}
main{max-width:760px;margin:0 auto;padding:16px}
h2{font-size:1.05rem;margin:0 0 10px}
.top{background:#0B1F4B;border-radius:18px;padding:10px 12px;margin-bottom:16px;display:flex;justify-content:center;box-shadow:0 4px 14px rgba(11,31,75,.28)}
.top img{display:block;width:100%;max-width:420px;height:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.note{color:var(--mut);font-size:.85rem;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:16px;overflow:hidden;box-shadow:0 2px 8px rgba(11,31,75,.07)}
.ch{margin:-16px -16px 14px;padding:11px 16px;color:#fff;background:linear-gradient(90deg,#0B1F4B,#1c4a9c)}
.ch.sky{background:linear-gradient(90deg,#5CC8FF,#c4ecff);color:#0B1F4B}
.ch.deep{background:linear-gradient(90deg,#0B1F4B,#2f6fc4)}
label{display:block;font-weight:bold;margin:10px 0 4px;font-size:.9rem;color:var(--pri)}
select,textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
select:focus,textarea:focus{outline:2px solid var(--sky2);outline-offset:1px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 16px;background:var(--pri);color:var(--onpri);font-weight:bold}
button:disabled{opacity:.5}
button.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
#prev{max-width:100%;max-height:200px;border-radius:10px;margin-top:8px;display:none}
#loc{font-size:.85rem;color:var(--mut);direction:ltr}
#msg,#amsg{margin-top:10px;font-size:.9rem;color:var(--pri)}
#pmap,#map{height:320px;border-radius:10px;border:1px solid var(--ln)}
.leg{display:flex;gap:12px;font-size:.8rem;color:var(--mut);margin-top:8px;flex-wrap:wrap}
.leg i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:middle}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:.85rem}
.bar i{display:block;height:12px;border-radius:6px}
.rep{display:flex;gap:10px;border-top:1px solid var(--ln);padding:10px 0;font-size:.9rem}
.rep img{width:72px;height:72px;object-fit:cover;border-radius:8px;flex:none}
.rep small{display:block;color:var(--mut)}.rep a{color:var(--pri)}
#admin{display:none}
.foot{text-align:center;margin:20px 0}
.foot button{font-size:.8rem;padding:6px 12px}
.top{background:#081a3f;border:1px solid #27498f}.card{box-shadow:0 2px 10px rgba(0,0,0,.25)}select,textarea{background:#0B1F4B}</style>
</head>

  pl.clearLayers();
  const g={};
  spots.forEach(s=>{const k=s.lat+","+s.lng;g[k]=g[k]||{lat:s.lat,lng:s.lng,n:0};g[k].n++});
  Object.values(g).forEach(c=>{
    const col=c.n>=5?"#c0392b":c.n>=3?"#e67e22":"#f1c40f";
    L.circle([c.lat,c.lng],{radius:60+25*Math.min(c.n,8),stroke:false,fillColor:col,fillOpacity:.45}).addTo(pl);
  });
  $("pcnt").textContent=spots.length;
}
onSnapshot(query(collection(db,"spots"),orderBy("t","desc"),limit(1000)),snap=>{
  spots=snap.docs.map(d=>d.data());
  drawHeat();
  if(spots.length&&!fitP){pmap.fitBounds(spots.map(s=>[s.lat,s.lng]),{maxZoom:17,padding:[30,30]});fitP=true}
},()=>{});

/* ===== الموقع والصورة ===== */
function getLoc(){
  $("loc").textContent="Detecting…";
  if(!navigator.geolocation){$("loc").textContent="Not supported";return}
  navigator.geolocation.getCurrentPosition(p=>{
    cur={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)};
    $("loc").textContent=cur.lat.toFixed(5)+", "+cur.lng.toFixed(5)+" (±"+cur.acc+"m)";
    pmap.setView([cur.lat,cur.lng],16);
  },()=>{$("loc").textContent="Please allow location access in your browser"},{enableHighAccuracy:true,timeout:15000});
}
$("photo").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const s=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    img=c.toDataURL("image/jpeg",.6);$("prev").src=img;$("prev").style.display="block";
  };im.src=r.result};
  r.readAsDataURL(f);
  getLoc();
};

/* ===== الإرسال: بلاغ كامل (خاص) + نقطة تقريبية (عامة) ===== */
$("send").onclick=async()=>{
  if(!cur){$("msg").textContent="Choose a photo first so your location can be detected.";return}
  if(!img){$("msg").textContent="Please add a photo.";return}
  $("send").disabled=true;$("msg").textContent="Sending…";
  try{
    const b=writeBatch(db),cat=$("cat").value;
    b.set(doc(collection(db,"reports")),{cat:cat,desc:$("desc").value.trim(),img:img,lat:cur.lat,lng:cur.lng,acc:cur.acc,t:serverTimestamp()});
    b.set(doc(collection(db,"spots")),{cat:cat,lat:rnd(cur.lat),lng:rnd(cur.lng),t:serverTimestamp()});
    await b.commit();
    img="";cur=null;$("prev").style.display="none";$("photo").value="";$("desc").value="";
    $("loc").textContent="Location is detected automatically when you choose a photo";
    $("msg").textContent="✓ Report submitted. Thank you!";
  }catch(err){$("msg").textContent="Could not send: "+err.message}
  $("send").disabled=false;
};

/* ===== لوحة المشرفة ===== */
function drawAdmin(){
  $("cnt").textContent=reports.length;
  const al=amap._l;al.clearLayers();
  reports.forEach(r=>{
    L.circleMarker([r.lat,r.lng],{radius:9,color:COL[r.cat]||"#777",fillColor:COL[r.cat]||"#777",fillOpacity:.6})
     .bindPopup("<b>"+esc(r.cat)+"</b><br>"+esc(r.desc||"")+'<br><img src="'+r.img+'" style="width:160px;border-radius:6px">').addTo(al);
  });
  const n={};reports.forEach(r=>n[r.cat]=(n[r.cat]||0)+1);
  const mx=Math.max(1,...Object.values(n));
  $("bars").innerHTML=Object.keys(n).sort((a,b)=>n[b]-n[a]).map(k=>
    '<div class="bar"><span style="width:110px">'+esc(k)+'</span><i style="width:'+(n[k]/mx*100)+'px;background:'+(COL[k]||"#777")+'"></i><b>'+n[k]+'</b></div>').join("");
  $("list").innerHTML=reports.slice(0,30).map(r=>
    '<div class="rep"><img src="'+r.img+'" alt=""><div><b>'+esc(r.cat)+'</b><small>'+esc(r.desc||"No description")+'</small><small>'+esc(r.time)+'</small><a href="https://www.google.com/maps?q='+r.lat+','+r.lng+'" target="_blank" rel="noopener">Open in Maps</a></div></div>').join("")||'<p class="note">No reports yet.</p>';
}
function showAdmin(){
  $("admin").style.display="block";
  if(!amap){
    amap=L.map("map").setView([24.7136,46.6753],15);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(amap);
    amap._l=L.layerGroup().addTo(amap);
  }
  setTimeout(()=>amap.invalidateSize(),200);
  unsub=onSnapshot(query(collection(db,"reports"),orderBy("t","desc"),limit(300)),snap=>{
    reports=snap.docs.map(d=>{const x=d.data();x.time=x.t?x.t.toDate().toLocaleString("en-US"):"Now";return x});
    drawAdmin();
    if(reports.length&&!fitA){amap.fitBounds(reports.map(r=>[r.lat,r.lng]),{maxZoom:17,padding:[30,30]});fitA=true}
  },err=>{$("amsg").textContent="Read error: "+err.message});
}
function hideAdmin(){
  if(unsub){unsub();unsub=null}
  reports=[];fitA=false;$("admin").style.display="none";
}
onAuthStateChanged(auth,u=>{
  if(u&&u.email===ADMIN){
    $("login").style.display="none";$("amsg").textContent="";showAdmin();
  }else{
    hideAdmin();$("login").style.display=location.hash==="#admin"?"inline-block":"none";
    if(u){$("amsg").textContent="This account is not authorized.";signOut(auth)}
  }
});
addEventListener("hashchange",()=>{if(!auth.currentUser)$("login").style.display=location.hash==="#admin"?"inline-block":"none"});
$("login").onclick=async()=>{
  try{await signInWithPopup(auth,new GoogleAuthProvider())}
  catch(err){$("amsg").textContent="Sign-in failed: "+err.message}
};
$("out").onclick=()=>signOut(auth);

$("csv").onclick=()=>{
  const rows=["type,description,lat,lng,time"].concat(reports.map(r=>[r.cat,'"'+(r.desc||"").replace(/"/g,'""')+'"',r.lat,r.lng,'"'+r.time+'"'].join(",")));
  const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,\uFEFF"+encodeURIComponent(rows.join("\n"));a.download="reports.csv";a.click();
};
</script>
